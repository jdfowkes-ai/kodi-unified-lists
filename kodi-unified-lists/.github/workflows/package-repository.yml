name: Package Kodi Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'addons.xml'
      - 'plugin.program.unifiedlists-*.zip'
      - 'repository.unifiedlists/**'
      - 'skin.arctic.fuse.3/**'
      - '.github/workflows/package-repository.yml'
      - '.build-source/**'

permissions:
  contents: write

concurrency:
  group: kodi-repository-publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout Arctic Fuse 3 fork
        uses: actions/checkout@v4
        with:
          repository: jdfowkes-ai/skin.arctic.fuse.3
          ref: omega
          path: skin-source
          persist-credentials: false

      - name: Build Kodi packages and update repository index
        shell: bash
        run: |
          set -euo pipefail

          test -f repository.unifiedlists/addon.xml
          test -f skin-source/addon.xml
          test -f .build-source/plugin.program.unifiedlists/addon.xml

          CURRENT_PLUGIN_VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('addons.xml').getroot()
          addon = next(a for a in root.findall('addon')
                       if a.get('id') == 'plugin.program.unifiedlists')
          print(addon.get('version'))
          PY
          )
          CURRENT_PLUGIN_ZIP="plugin.program.unifiedlists-${CURRENT_PLUGIN_VERSION}.zip"
          test -f "$CURRENT_PLUGIN_ZIP"

          python3 - <<'PY'
          import copy
          import xml.etree.ElementTree as ET

          index_path = 'addons.xml'
          index = ET.parse(index_path).getroot()
          skin = ET.parse('skin-source/addon.xml').getroot()
          plugin = ET.parse('.build-source/plugin.program.unifiedlists/addon.xml').getroot()
          if skin.tag != 'addon' or skin.get('id') != 'skin.arctic.fuse.3':
              raise SystemExit('The checked out source is not Arctic Fuse 3.')
          if plugin.tag != 'addon' or plugin.get('id') != 'plugin.program.unifiedlists':
              raise SystemExit('The Unified Lists source addon.xml is invalid.')

          for addon in (plugin, skin):
              for existing in index.findall('addon'):
                  if existing.get('id') == addon.get('id'):
                      index.remove(existing)
              index.append(copy.deepcopy(addon))
          ET.ElementTree(index).write(index_path, encoding='utf-8', xml_declaration=True)
          print(f"Added {plugin.get('id')} {plugin.get('version')} and {skin.get('id')} {skin.get('version')} to addons.xml")
          PY

          SKIN_VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          addon = ET.parse('skin-source/addon.xml').getroot()
          print(addon.get('version'))
          PY
          )
          SKIN_ZIP="skin.arctic.fuse.3-${SKIN_VERSION}.zip"

          PLUGIN_VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('addons.xml').getroot()
          addon = next(a for a in root.findall('addon')
                       if a.get('id') == 'plugin.program.unifiedlists')
          print(addon.get('version'))
          PY
          )
          PLUGIN_ZIP="plugin.program.unifiedlists-${PLUGIN_VERSION}.zip"
          if [ ! -f "$PLUGIN_ZIP" ]; then
            BUILD_DIR=$(mktemp -d)
            unzip -q "$CURRENT_PLUGIN_ZIP" -d "$BUILD_DIR"
            test -d "$BUILD_DIR/plugin.program.unifiedlists"
            cp -R .build-source/plugin.program.unifiedlists/. \
              "$BUILD_DIR/plugin.program.unifiedlists/"
            (cd "$BUILD_DIR" && zip -qr "$GITHUB_WORKSPACE/$PLUGIN_ZIP" plugin.program.unifiedlists)
          fi
          unzip -tq "$PLUGIN_ZIP"
          echo "PLUGIN_ZIP=$PLUGIN_ZIP" >> "$GITHUB_ENV"

          md5sum addons.xml | cut -d ' ' -f1 > addons.xml.md5

          mkdir -p plugin.program.unifiedlists skin.arctic.fuse.3
          cp "$PLUGIN_ZIP" plugin.program.unifiedlists/
          git -C skin-source archive --format=zip \
            --prefix=skin.arctic.fuse.3/ HEAD > "$SKIN_ZIP"
          unzip -tq "$SKIN_ZIP"
          cp "$SKIN_ZIP" skin.arctic.fuse.3/

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          output = Path('repository.unifiedlists-1.0.0.zip')
          with ZipFile(output, 'w', compression=ZIP_DEFLATED) as archive:
              for path in sorted(Path('repository.unifiedlists').rglob('*')):
                  if path.is_file():
                      archive.write(path, path.as_posix())
          PY

          test -f "skin.arctic.fuse.3/${SKIN_ZIP}"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('addons.xml').getroot()
          ids = [a.get('id') for a in root.findall('addon')]
          if ids.count('skin.arctic.fuse.3') != 1:
              raise SystemExit('Expected exactly one Arctic Fuse 3 entry in addons.xml.')
          PY

      - name: Publish ZIP files and repository index
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add addons.xml
          git add addons.xml.md5
          git add repository.unifiedlists-1.0.0.zip
          git add "$PLUGIN_ZIP"
          git add plugin.program.unifiedlists/
          git add skin.arctic.fuse.3/

          if git diff --cached --quiet; then
            echo "No package changes."
            exit 0
          fi

          git commit -m "Publish Kodi packages including Arctic Fuse 3 spotlight"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              echo "Published successfully."
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep 3
          done

          echo "Publishing failed after five attempts."
          exit 1
